<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="mascot.png">
<title>PinkAgc Browser — Profile Manager</title>
<style>
  /* Roboto thật, bundle local (variable, có subset tiếng Việt) — không phụ thuộc mạng */
  @font-face{font-family:Roboto;font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/roboto-vietnamese.woff2') format('woff2');
    unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;}
  @font-face{font-family:Roboto;font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/roboto-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:Roboto;font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/roboto-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  :root{
    --sidebar:#1B1C26; --sidebar-hover:#262734; --sidebar-line:#2e3040;
    --primary:#EA1A87; --primary-dark:#C71574; --primary-soft:#FDE4F1;
    --page:#FFF5FA; --card:#FFFFFF; --line:#F0DCE9; --line2:#E7D4E2;
    --ink:#2A2233; --mut:#8A8A95; --mut2:#B6AFBC;
    --ok:#1FA971; --okbg:#E6F7EC; --warn:#E8A200; --err:#E5484D; --errbg:#FDEAEA;
    --r:12px; --r-sm:9px;
    --sidebar-w:232px; --row-h:54px; --btn-h:38px;
    --shadow:0 1px 3px rgba(40,10,40,.06), 0 8px 24px rgba(180,30,120,.06);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);
    font:14px/1.5 Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#e3cede;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden}

  /* ---------- Sidebar ---------- */
  .side{background:var(--sidebar);color:#e9eaf0;display:flex;flex-direction:column;overflow:hidden}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 14px}
  .brand img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .brand .wm{line-height:1}
  .brand .wm b{font-size:23px;font-weight:700;color:var(--primary);letter-spacing:.2px}
  .brand .wm span{display:block;font-size:13px;color:#b9bac6;margin-top:2px;font-weight:600}
  .nav{flex:1;overflow-y:auto;padding:6px 12px 16px}
  .nav::-webkit-scrollbar-thumb{background:#3a3c4e}
  .nav .sep{height:1px;background:var(--sidebar-line);margin:12px 10px}
  .nav button{display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;color:#c6c7d2;
    padding:11px 14px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;margin:2px 0;text-align:left;transition:.12s}
  .nav button:hover{background:var(--sidebar-hover);color:#fff}
  .nav button.on{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(234,26,135,.35)}
  .nav button svg{width:20px;height:20px;flex:none;stroke-width:2}
  .nav .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:20px;letter-spacing:.3px}
  .nav button.on .badge{background:#fff;color:var(--primary)}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;background:var(--page)}
  .topbar{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:14px 26px;border-bottom:1px solid var(--line)}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:none;color:#6b6472;cursor:pointer;
    display:grid;place-items:center;transition:.12s}
  .iconbtn:hover{background:#fbe8f3;color:var(--primary)}
  .iconbtn svg{width:20px;height:20px;stroke-width:2}
  .vline{width:1px;height:22px;background:var(--line2);margin:0 6px}
  .content{flex:1;overflow-y:auto;padding:26px 30px 40px}

  /* ---------- Page header ---------- */
  .phead{margin-bottom:20px}
  .phead h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.3px}
  .phead h1 em{font-style:normal;color:var(--primary)}
  .phead p{margin:6px 0 0;color:var(--mut);font-size:14.5px}

  /* ---------- Buttons / inputs ---------- */
  button{font:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;min-height:var(--btn-h);font-weight:500;
    cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:.12s;white-space:nowrap}
  .btn:hover{background:#faf2f7;border-color:var(--line2)}
  .btn svg{width:17px;height:17px;stroke-width:2.2}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(234,26,135,.28)}
  .btn.pri:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
  .btn.ghost-pink{border-color:var(--primary);color:var(--primary);background:#fff}
  .btn.ghost-pink:hover{background:var(--primary-soft)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:10px;
    padding:10px 12px;font:inherit;color:var(--ink);outline:none;transition:.12s}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(234,26,135,.12)}
  input::placeholder{color:var(--mut2)}
  label{display:block;font-weight:500;font-size:13px;margin:0 0 6px;color:#5a5260}
  .field{margin-bottom:16px}
  .search{position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut2)}
  .search input{padding-left:36px}

  /* toggle */
  .toggle{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .toggle input{opacity:0;width:0;height:0}
  .toggle span{position:absolute;inset:0;background:#d9cad3;border-radius:20px;transition:.15s;cursor:pointer}
  .toggle span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .toggle input:checked + span{background:var(--primary)}
  .toggle input:checked + span:before{transform:translateX(20px)}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 18px;font-weight:600;color:var(--mut);cursor:pointer;border-right:1px solid var(--line2);transition:.1s}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--primary-soft);color:var(--primary)}
  .segrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .segrow>span{font-weight:600;color:#5a5260}
  .ep{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ep:last-child{border-bottom:0}
  .verb{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;min-width:52px;text-align:center;flex:none}
  .verb.GET{background:#e3f6e9;color:#1a8f5a} .verb.POST{background:#eaf1fe;color:#2563eb}
  .verb.DELETE{background:#fdeaea;color:#d23} .verb.PUT{background:#fef3e2;color:#c77}
  .ep .p{font-family:ui-monospace,monospace;font-size:13px;font-weight:600}
  .ep .d{color:var(--mut);font-size:12.5px;margin-left:auto;text-align:right;max-width:46%}
  .apigrp{margin-bottom:22px}
  .apigrp>h3{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:15px}
  .apigrp>h3 svg{width:18px;height:18px;flex:none;color:var(--primary)}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .toolbar .grow{flex:1}

  /* ---------- Table ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:visible}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:12px;font-weight:500;color:var(--mut);text-transform:none;
    padding:14px 16px;border-bottom:1px solid var(--line);background:#fffafd;white-space:nowrap;
    position:sticky;top:0;z-index:5}
  .card>table thead th:first-child{border-top-left-radius:var(--r)}
  .card>table thead th:last-child{border-top-right-radius:var(--r)}
  tbody tr{height:var(--row-h)}
  tbody td{padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fff8fc}
  td>svg{width:18px;height:18px;vertical-align:-4px;color:var(--mut)}
  .chk{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)} .dot.off{background:#c7bccb}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
  .pill.run{color:var(--ok);border-color:#bfe8d2;background:var(--okbg)}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;background:#f3eef1;color:#7a7183}
  .tag.cr{color:#2563eb;background:#eaf1fe}.tag.ff{color:#c2410c;background:#fef0e7}
  .tagchip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--primary-soft);color:var(--primary);margin:1px 2px}
  .hcol-os .c-os,.hcol-browser .c-browser,.hcol-engine .c-engine,.hcol-tz .c-tz,.hcol-lastrun .c-lastrun,.hcol-tags .c-tags{display:none}
  .colmenu{position:absolute;right:0;top:40px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px 14px;min-width:190px;text-align:left}
  .colmenu label{display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:5px 0;font-size:13px;cursor:pointer;white-space:nowrap}
  .colmenu label input{flex:none;margin:0}
  .pager2{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:13px;color:var(--mut);flex-wrap:wrap}
  .pager2 button{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
  .pager2 button:disabled{opacity:.4;cursor:default}
  .pager2 select{width:auto;padding:4px 8px}
  .mono{font-family:ui-monospace,"Cascadia Mono",monospace;font-size:12.5px}
  .rowact{display:flex;gap:6px;justify-content:flex-end;align-items:center}
  .colordot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  /* ô Profile 2 dòng */
  .pcell b{display:block;font-weight:700;line-height:1.25}
  .pcell .psub{font-size:12px;color:var(--mut2);margin-top:2px;font-weight:500}
  .gchip{font-size:12px;font-weight:600;color:#7a7183;background:#f3eef1;padding:3px 9px;border-radius:7px;white-space:nowrap}
  /* nút copy nhỏ trong ô */
  .icplain{border:0;background:none;color:var(--mut2);cursor:pointer;padding:2px;vertical-align:middle;line-height:0}
  .icplain:hover{color:var(--primary)}
  .icplain svg{width:14px;height:14px}
  /* kebab menu ⋯ (dùng chung) */
  .kebab{position:relative;display:inline-block}
  .kmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:25;background:var(--card);border:1px solid var(--line);
    border-radius:11px;box-shadow:0 12px 34px rgba(60,10,50,.18);padding:6px;min-width:184px;display:none}
  .kmenu.show{display:block}
  .kmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 11px;border-radius:8px;
    font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;white-space:nowrap}
  .kmenu button:hover{background:var(--primary-soft);color:var(--primary)}
  .kmenu button svg{width:16px;height:16px;stroke-width:2;flex:none;color:inherit}
  .kmenu button.danger{color:var(--err)} .kmenu button.danger:hover{background:var(--errbg);color:var(--err)}
  .kmenu .ksep{height:1px;background:var(--line);margin:5px 4px}
  /* Developer: nav danh mục trái */
  .devnav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--ink);padding:9px 12px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;text-align:left;margin:1px 0}
  .devnav:hover{background:#faf2f7}
  .devnav.on{background:var(--primary-soft);color:var(--primary)}
  .devnav svg{width:16px;height:16px;flex:none;stroke-width:2}
  .devnav>.n{margin-left:auto;font-size:11px;color:var(--mut2);font-weight:700}
  /* step số (MCP) */
  .stepn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:700;margin-right:9px;flex:none}
  .steph{display:flex;align-items:center;margin:0 0 4px}
  /* home stat */
  .statn{font-family:inherit;font-size:30px;font-weight:700;margin-top:6px;color:var(--primary);line-height:1}
  .statl{font-size:12px;color:var(--mut);font-weight:600}
  /* trình dựng automation */
  .austep{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .austep>select{width:auto;min-width:140px}
  .austep>input{flex:1;min-width:110px}
  .auno{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .austep .gp{margin-left:auto;display:flex;gap:4px}
  .austep .gp .btn{padding:6px 9px}

  /* pagination */
  .pager{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 18px;color:var(--mut);font-size:13px}
  .pager .pages{display:flex;gap:4px}
  .pager .pages button{min-width:34px;height:34px;border:1px solid var(--line2);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:600}
  .pager .pages button.on{border-color:var(--primary);color:var(--primary)}
  .pager select{width:auto;padding:6px 8px}

  /* empty / placeholder */
  .empty{text-align:center;padding:70px 20px;color:var(--mut)}
  .empty img{width:120px;opacity:.9;margin-bottom:14px}
  .empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
  .soon{display:inline-block;margin-top:8px;background:var(--primary-soft);color:var(--primary);font-weight:700;padding:5px 12px;border-radius:20px;font-size:12.5px}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,10,30,.42);display:none;align-items:flex-start;justify-content:center;
    padding:34px 20px;z-index:40;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(60,10,50,.3);width:min(980px,100%);
    display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
  .modal.sm{width:min(460px,100%)}
  .modal.lg{width:min(1200px,100%)}
  .mbody{overflow:auto;flex:1 1 auto}
  .mfoot{position:sticky;bottom:0}
  .ferr{color:var(--err);font-size:12.5px;margin-top:5px;font-weight:600;display:none}
  .ferr.show{display:block}
  .mhead{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  .mhead .ic{width:40px;height:40px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
  .mhead .ic svg{width:22px;height:22px;stroke-width:2.2}
  .mhead h2{font-size:21px;margin:0;font-weight:700;flex:1}
  .mhead .x{width:36px;height:36px;border:0;background:none;color:var(--mut);border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .mhead .x:hover{background:#f6eef3;color:var(--ink)}
  .mbody{padding:22px 24px}
  .createtop{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;margin-bottom:6px}
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:18px 0 22px}
  .tabs button{border:0;background:none;padding:0 0 12px;font-weight:500;color:var(--mut);cursor:pointer;position:relative;font-size:15px}
  .tabs button.on{color:var(--primary)}
  .tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--primary);border-radius:3px}
  .split{display:grid;grid-template-columns:1fr 330px;gap:26px}
  @media(max-width:860px){.split{grid-template-columns:1fr}.createtop{grid-template-columns:1fr 1fr}}
  .summary{background:#fbf6fa;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .summary .row{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px}
  .summary .row span:first-child{color:var(--mut)}
  .summary .row span:last-child{font-weight:600}
  .hint{margin-top:14px;background:var(--okbg);border:1px solid #cdeedb;color:#2f7d4f;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6}
  .inline{display:flex;align-items:center;gap:12px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fffafd}
  .checkline{display:flex;align-items:center;gap:9px;font-weight:600;color:#5a5260;margin-bottom:14px}
  /* thẻ Nâng cao + công tắc tổng (Master Power) */
  .advbox{border:1px solid var(--line2);border-radius:12px;padding:14px 16px;margin-top:16px;background:#fffafd}
  .advbox .advhead{display:flex;align-items:center;gap:10px}
  .advbox .advhead b{font-size:14px;font-weight:600}
  .advbox .advbody{margin-top:12px;transition:.15s}
  .advbox .advbody.off{opacity:.45;filter:grayscale(.35)}
  .advbox .advbody .checkline:last-child,.advbox .advbody .field:last-child{margin-bottom:0}
  [data-theme="dark"] .advbox{background:#241d30}

  /* toast */
  #toast{position:fixed;right:22px;bottom:22px;background:#241b2b;color:#fff;border-radius:12px;padding:13px 18px 13px 40px;
    box-shadow:0 14px 40px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.22s;z-index:60;max-width:380px;font-weight:600;
    border:1px solid rgba(255,255,255,.1)}
  #toast:before{content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:var(--primary)}
  #toast.show{opacity:1;transform:none}
  #toast.ok:before{background:var(--ok)} #toast.err:before{background:var(--err)}
  .dim{color:var(--mut)}
  .flag{font-size:16px;margin-right:7px}

  /* ===== Dark mode ===== */
  :root[data-theme="dark"]{
    --sidebar:#121019; --sidebar-hover:#221c2e; --sidebar-line:#2c2638;
    --primary:#ff3d9a; --primary-dark:#e21a7f; --primary-soft:#3a1430;
    --page:#141019; --card:#1e1926; --line:#2e2738; --line2:#3a3246;
    --ink:#efe9f3; --mut:#9f93ad; --mut2:#6e6479;
    --ok:#3fd089; --okbg:#15311f; --warn:#e0a53a; --err:#ff5a5f; --errbg:#331518;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  [data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3a3246}
  [data-theme="dark"] thead th{background:#241d30}
  [data-theme="dark"] tbody tr:hover{background:#241d30}
  [data-theme="dark"] .btn{background:#241d30}
  [data-theme="dark"] .btn:hover{background:#2e2740}
  [data-theme="dark"] .btn.pri{color:#fff}
  [data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:#17131f;color:var(--ink)}
  [data-theme="dark"] .seg button{background:#17131f;color:var(--mut)}
  [data-theme="dark"] .seg button.on{background:var(--primary-soft);color:var(--primary)}
  [data-theme="dark"] .modal{background:#1e1926}
  [data-theme="dark"] .mfoot{background:#241d30}
  [data-theme="dark"] .summary{background:#241d30}
  [data-theme="dark"] .hint{background:#15311f;border-color:#1f4d33;color:#8fe0b0}
  [data-theme="dark"] .pager .pages button{background:#241d30;color:var(--ink)}
  [data-theme="dark"] .devnav:hover{background:#241d30}
  [data-theme="dark"] .tag{background:#2e2740;color:#b8acc4}
  [data-theme="dark"] .gchip{background:#2e2740;color:#b8acc4}
  [data-theme="dark"] .tagchip{background:var(--primary-soft);color:#ff8cc4}
  [data-theme="dark"] .iconbtn:hover{background:#2e1a28}
  [data-theme="dark"] .mhead .x:hover{background:#2e2740}
  [data-theme="dark"] .kmenu button{color:var(--ink)}
  [data-theme="dark"] .empty img,[data-theme="dark"] .brand img{filter:none}
  [data-theme="dark"] .btn.pri{box-shadow:0 2px 8px rgba(0,0,0,.35)}
  [data-theme="dark"] .nav button.on{box-shadow:none}
  [data-theme="dark"] .pill.run{background:#15311f;border-color:#1f4d33}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">
      <img src="mascot.png" alt="" onerror="this.style.display='none'">
      <div class="wm"><b>Pinkagc</b><span>Browser</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="iconbtn" id="themeBtn" title="Sáng / Tối" onclick="toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
      <button class="iconbtn" title="Ngôn ngữ" onclick="toast('Hiện chỉ hỗ trợ tiếng Việt')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></button>
      <button class="iconbtn" title="Làm mới" onclick="refresh()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
      <span class="vline"></span>
      <button class="iconbtn" title="Cài đặt" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- CREATE / EDIT MODAL mount -->
<div class="overlay" id="overlay"></div>
<div id="toast"></div>

<script>
const API="/api/v3";
let STATE={view:"home", profiles:[], proxies:[], browsers:[], providers:[], groups:[], sel:new Set(), page:1, per:20};

/* ---------- icons ---------- */
const I={
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  puzzle:'<path d="M9 3a2 2 0 0 1 4 0c0 1 .5 1.5 1.5 1.5H17a1 1 0 0 1 1 1v2.5c0 1 .5 1.5 1.5 1.5a2 2 0 0 1 0 4c-1 0-1.5.5-1.5 1.5V19a1 1 0 0 1-1 1h-3a2 2 0 0 0-4 0H5a1 1 0 0 1-1-1v-3c0-1-.5-1.5-1.5-1.5a2 2 0 0 1 0-4C3.5 10.5 4 10 4 9V6a1 1 0 0 1 1-1h2.5C8.5 5 9 4.5 9 3z"/>',
  plug:'<path d="M9 2v6M15 2v6M7 8h10v3a5 5 0 0 1-10 0zM12 16v6"/>',
  trash:'<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 14h.01M16 14h.01M2 13v2M22 13v2"/>',
  store:'<path d="M4 9l1.5-5h13L20 9M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/>',
  code:'<path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 13.6A1.6 1.6 0 0 0 20.9 12 1.6 1.6 0 0 0 19.4 10.4l-.6-.2.2-.6a1.6 1.6 0 0 0-2-2l-.6.2-.2-.6A1.6 1.6 0 0 0 12 3.1a1.6 1.6 0 0 0-1.6 1.5l-.2.6-.6-.2a1.6 1.6 0 0 0-2 2l.2.6-.6.2A1.6 1.6 0 0 0 3.1 12a1.6 1.6 0 0 0 1.5 1.6l.6.2-.2.6a1.6 1.6 0 0 0 2 2l.6-.2.2.6A1.6 1.6 0 0 0 12 20.9a1.6 1.6 0 0 0 1.6-1.5l.2-.6.6.2a1.6 1.6 0 0 0 2-2l-.2-.6z"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', play:'<path d="M6 4l14 8-14 8z"/>', stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>', up:'<path d="M12 20V8M6 14l6-6 6 6"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/>', dots:'<circle cx="12" cy="6" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="18" r="1"/>',
  shuffle:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>', copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.5-1A4 4 0 0 0 6 19z"/>', share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
};
const svg=(d,cls="")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const NAV=[
  {id:"home",label:"Trang chủ",icon:"home"},
  {id:"profiles",label:"Profiles",icon:"user"},
  {id:"groups",label:"Nhóm",icon:"folder"},
  {id:"proxy",label:"Proxy",icon:"globe"},
  {id:"extensions",label:"Extensions",icon:"puzzle"},
  {id:"trash",label:"Thùng rác",icon:"trash"},
  {sep:1},
  {id:"automation",label:"Automation",icon:"bot"},
  {id:"schedules",label:"Lịch & Nhật ký",icon:"doc"},
  {id:"engines",label:"Engine",icon:"plug"},
  {id:"appstore",label:"App store",icon:"store"},
  {id:"cloud",label:"Cloud / Team",icon:"cloud"},
  {id:"developer",label:"Developer",icon:"code"},
  {sep:1},
  {id:"settings",label:"Cài đặt",icon:"gear"},
  {id:"mcp",label:"MCP",icon:"bot",badge:"new"},
  {id:"log",label:"Log",icon:"doc"},
  {id:"about",label:"Giới thiệu",icon:"info"},
];

/* ---------- helpers ---------- */
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,k=""){const t=document.getElementById("toast");t.textContent=m;t.className="show "+k;clearTimeout(t._t);t._t=setTimeout(()=>t.className=t.className.replace("show",""),2800);}
async function j(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!d.success)throw new Error(d.message||"Lỗi");return d.data;}
const H={headers:{"Content-Type":"application/json"}};
const body=o=>({...H,method:"POST",body:JSON.stringify(o)});
function fmtAgo(iso){if(!iso)return "—";const s=(Date.now()-new Date(iso).getTime())/1000;if(isNaN(s))return "—";
  if(s<60)return "vừa xong";if(s<3600)return Math.floor(s/60)+" phút";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+" ngày";}
function proxyBadge(raw){if(!raw)return '<span class="dim">Không proxy</span>';
  const sch=(raw.includes("://")?raw.split("://")[0]:"http").toUpperCase();
  const hostport=raw.replace(/^[a-z0-9]+:\/\//i,"").split(/[:@]/).slice(0,2).join(":");
  return `<span class="tag">${esc(sch)}</span> <span class="mono dim">${esc(hostport)}</span>`
    +` <button class="icplain" title="Sao chép" onclick="event.stopPropagation();cp('${esc(hostport)}')">${svg(I.copy)}</button>`;}
const tagChips=tags=>{if(!tags||!tags.length)return '<span class="dim">—</span>';
  const shown=tags.slice(0,2).map(t=>`<span class="tagchip">${esc(t)}</span>`).join("");
  return shown+(tags.length>2?`<span class="tagchip" style="background:#efe9ee;color:var(--mut)" title="${esc(tags.slice(2).join(', '))}">+${tags.length-2}</span>`:"");};
const allTags=()=>[...new Set(STATE.profiles.flatMap(p=>p.tags||[]))].sort();
const OPTCOLS=[["os","OS"],["browser","Browser"],["engine","Engine"],["tz","Timezone"],["lastrun","Lần chạy cuối"],["tags","Tags"]];
const HCOL_DEFAULT=["os","browser","engine","tz"];   // mặc định ẩn cột kỹ thuật (lần đầu, chưa có lưu)
function loadHcol(){try{const s=localStorage.getItem("pinkagc_hcol");return new Set(s===null?HCOL_DEFAULT:JSON.parse(s));}catch(e){return new Set(HCOL_DEFAULT);}}
let HCOL=loadHcol();
const hcolClass=()=>[...HCOL].map(k=>"hcol-"+k).join(" ");
function toggleCol(k,on){on?HCOL.delete(k):HCOL.add(k);try{localStorage.setItem("pinkagc_hcol",JSON.stringify([...HCOL]));}catch(e){}
  const c=document.getElementById("profCard");if(c)c.className="card "+hcolClass();}
function toggleColMenu(){const m=document.getElementById("colMenu");if(m)m.style.display=m.style.display==="block"?"none":"block";}
function onSearch(v){STATE.q=v;STATE.page=1;render();const e=document.getElementById("pq");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}
function gotoPage(n){STATE.page=Math.max(1,n);render();}
/* Dark mode: lưu localStorage, áp lên <html data-theme> */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("pinkagc_theme",t);}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");}
(function(){try{const t=localStorage.getItem("pinkagc_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
/* menu ⋯ dùng chung: mở menu của nút vừa bấm, đóng các menu khác; click ngoài đóng tất cả */
function toggleKebab(btn){const menu=btn.nextElementSibling,open=menu.classList.contains('show');
  document.querySelectorAll('.kmenu.show').forEach(m=>m.classList.remove('show'));
  if(!open)menu.classList.add('show');event.stopPropagation();}
document.addEventListener('click',()=>document.querySelectorAll('.kmenu.show').forEach(m=>m.classList.remove('show')));

/* ---------- sidebar ---------- */
function renderNav(){
  document.getElementById("nav").innerHTML=NAV.map(n=>n.sep?'<div class="sep"></div>':
    `<button class="${STATE.view===n.id?'on':''}" onclick="go('${n.id}')">${svg(I[n.icon])}<span>${n.label}</span>${n.badge?`<span class="badge">${n.badge}</span>`:''}</button>`).join("");
}
function go(v){STATE.view=v;STATE.page=1;renderNav();render();}
function refresh(){load().then(render);}

/* ---------- data ---------- */
async function load(){
  try{
    const[p,px,bs,pr,gr]=await Promise.all([
      j(`${API}/profiles`), j(`${API}/proxies`).catch(()=>[]),
      j(`${API}/browsers`).catch(()=>[]), j(`${API}/proxy/providers`).catch(()=>[]),
      j(`${API}/groups`).catch(()=>[]),
    ]);
    STATE.profiles=p;STATE.proxies=px;STATE.browsers=bs;STATE.providers=pr;STATE.groups=gr;
  }catch(e){toast("Không kết nối backend: "+e.message,"err");}
}

/* ================= VIEWS ================= */
function render(){
  const el=document.getElementById("content");
  const v=STATE.view;
  if(v==="home"){el.innerHTML=viewHome();loadHomeHealth();}
  else if(v==="profiles") el.innerHTML=viewProfiles();
  else if(v==="proxy") el.innerHTML=viewProxy();
  else if(v==="trash") {el.innerHTML=viewTrash();loadTrash();}
  else if(v==="automation"){el.innerHTML=viewAutomation();loadAuScripts();}
  else if(v==="schedules"){el.innerHTML=viewSchedules();loadSchedules();}
  else if(v==="engines"){el.innerHTML=viewEngines();loadEngines();}
  else if(v==="mcp"){el.innerHTML=viewMCP();loadMcp();}
  else if(v==="about"){el.innerHTML=viewAbout();loadAbout();}
  else if(v==="groups") el.innerHTML=viewGroups();
  else if(v==="extensions"){el.innerHTML=viewExtensions();loadExts();}
  else if(v==="settings"){el.innerHTML=viewSettings();loadSettings();}
  else if(v==="log"){el.innerHTML=viewLog();loadLog();}
  else if(v==="developer"){el.innerHTML=viewDeveloper();loadDevHealth();}
  else if(v==="appstore") el.innerHTML=viewAppStore();
  else if(v==="cloud"){el.innerHTML=viewCloud();loadCloud();}
  else el.innerHTML=viewSoon(v);
  linkLabels();   // gán label ngay trong cùng tick render -> không còn khoảng transient thiếu label
}

/* ----- Trang chủ (welcome) ----- */
const statCard=(label,val)=>`<div class="card" style="padding:18px"><div class="statl">${esc(label)}</div><div class="statn">${val}</div></div>`;
function viewHome(){
  const total=STATE.profiles.length, running=STATE.profiles.filter(p=>p.status==="running").length;
  return `<div class="phead"><h1>Chào mừng đến <em>PinkAgc Browser</em></h1><p>Trình duyệt antidetect tự host — quản lý profile, fingerprint và proxy từ một chỗ.</p></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px">
     ${statCard("Tổng profile",total)}
     ${statCard("Đang chạy",`<span style="color:var(--ok)">${running}</span>`)}
     ${statCard("Nhóm",STATE.groups.length)}
     ${statCard("Proxy",STATE.proxies.length)}
   </div>
   <div class="split" style="grid-template-columns:1fr 320px;align-items:start">
     <div class="card" style="padding:24px">
       <h3 style="margin-top:0">Bắt đầu nhanh</h3>
       <div class="toolbar" style="margin:14px 0 0">
         <button class="btn pri" onclick="openCreate()">${svg(I.plus)}Tạo profile</button>
         <button class="btn" onclick="go('profiles')">${svg(I.user)}Danh sách Profile</button>
         <button class="btn" onclick="go('proxy')">${svg(I.globe)}Proxy</button>
         <button class="btn" onclick="go('automation')">${svg(I.bot)}Kịch bản JSON</button>
       </div>
       <p class="dim" style="font-size:13px;margin-top:16px;line-height:1.7">Mỗi profile một fingerprint riêng (GPU · cores · memory · font coherent theo máy thật), proxy auth-relay (http/socks5), chống rò WebRTC/DNS, auto-timezone theo IP. Lõi mở, không giới hạn số profile.</p>
     </div>
     <div class="card" style="padding:24px;text-align:center">
       <img src="mascot.png" style="width:92px" onerror="this.style.display='none'">
       <h2 style="margin:8px 0 2px;font-size:19px">Pinkagc <span style="color:var(--primary)">Browser</span></h2>
       <p class="dim" style="font-size:12.5px;margin:2px 0 0">Antidetect · open-core</p>
       <div id="homeHealth" class="dim" style="margin-top:14px;font-size:12.5px">Đang kiểm tra engine...</div>
     </div>
   </div>`;
}
async function loadHomeHealth(){try{const d=await j(`${API}/health`);const el=document.getElementById("homeHealth");if(el)el.innerHTML=`<span class="dot ok"></span> ${esc(d.app)} · ${d.running.length} đang chạy<br><span style="font-size:11px">engine: ${esc((d.engines||[]).join(", "))}</span>`;}catch(e){const el=document.getElementById("homeHealth");if(el)el.innerHTML='<span class="dot err"></span> Không kết nối backend';}}

/* ----- Profiles ----- */
function viewProfiles(){
  const gf=STATE.gf||"", tf=STATE.tf||"", sf=STATE.sf||"", q=(STATE.q||"").toLowerCase();
  const gmap=Object.fromEntries(STATE.groups.map(g=>[g.id,g.name]));
  const list=STATE.profiles.filter(p=>(!gf||p.group_id===gf)&&(!tf||(p.tags||[]).includes(tf))&&(!sf||(p.status||"stopped")===sf)&&(!q||(p.name||"").toLowerCase().includes(q)));
  const total=list.length, perPage=STATE.perPage||30, pages=Math.max(1,Math.ceil(total/perPage));
  const page=Math.min(STATE.page||1,pages), paged=list.slice((page-1)*perPage,page*perPage);
  const rows=paged.length? paged.map(p=>{
    const run=p.status==="running";
    const dot=p.color?`<span class="colordot" style="background:${esc(p.color)}"></span>`:"";
    const eng=p.engine==="camoufox"?'<span class="tag ff">firefox</span>':p.engine==="botbrowser"?'<span class="tag cr">chromium</span>':`<span class="tag">${esc(p.engine||'auto')}</span>`;
    return `<tr data-name="${esc((p.name||'').toLowerCase())}">
      <td><input type="checkbox" class="chk rowchk" value="${p.id}" ${STATE.sel.has(p.id)?'checked':''} onchange="onSel('${p.id}',this.checked)"></td>
      <td><div class="pcell"><b>${p.pinned?'📌 ':''}${dot}${esc(p.name)}</b>${p.note?` <span class="dim" title="${esc(p.note)}">✎</span>`:''}<div class="psub">${esc(p.browser||'—')} · ${esc(p.os||'—')}</div></div></td>
      <td>${p.group_id&&gmap[p.group_id]?`<span class="gchip">${esc(gmap[p.group_id])}</span>`:'<span class="dim">—</span>'}</td>
      <td class="dim c-os">${esc(p.os||'—')}</td>
      <td class="dim c-browser">${esc(p.browser||'—')}</td>
      <td class="c-engine">${eng}</td>
      <td title="${esc(p.proxy||'')}">${proxyBadge(p.proxy)}</td>
      <td class="dim c-tz">${esc(p.timezone||'auto')}</td>
      <td>${run?'<span class="pill run"><span class="dot ok"></span>Đang chạy</span>':'<span class="pill"><span class="dot ok"></span>Sẵn sàng</span>'}</td>
      <td class="dim c-lastrun" title="${esc(p.last_run_at||'')}">${fmtAgo(p.last_run_at)}</td>
      <td class="c-tags">${tagChips(p.tags)}</td>
      <td><div class="rowact">
        ${run?`<button class="btn sm ghost-pink" onclick="act('stop/${p.id}','Đã đóng')">${svg(I.stop)}Dừng</button>`
             :`<button class="btn sm pri" onclick="startP('${p.id}')">${svg(I.play)}Mở</button>`}
        <button class="btn sm" onclick="editP('${p.id}')" title="Sửa">✎ Sửa</button>
        <div class="kebab">
          <button class="btn sm" onclick="toggleKebab(this)" title="Thêm thao tác">${svg(I.dots)}</button>
          <div class="kmenu">
            <button onclick="openProxy('${p.id}')">${svg(I.globe)} Gán proxy</button>
            <button onclick="cloneP('${p.id}')">${svg(I.copy)} Nhân bản</button>
            <button onclick="randP('${p.id}')">${svg(I.shuffle)} Random fingerprint</button>
            <button onclick="teamShare('${p.id}')">${svg(I.share)} Chia sẻ (team)</button>
            <div class="ksep"></div>
            <button class="danger" onclick="delP('${p.id}','${esc(p.name)}')">${svg(I.trash)} Xoá</button>
          </div>
        </div>
      </div></td></tr>`;}).join("")
    : `<tr><td colspan="12"><div class="empty"><img src="mascot.png" onerror="this.style.display='none'"><h3>Chưa có profile nào</h3><p>Bấm <b>Tạo profile</b> để bắt đầu.</p></div></td></tr>`;
  const bulk=STATE.sel.size?`<div class="toolbar" style="background:var(--primary-soft);padding:10px 14px;border-radius:10px">
      <b>${STATE.sel.size} đã chọn</b>
      <button class="btn sm pri" onclick="bulk('start')">${svg(I.play)}Mở</button>
      <button class="btn sm" onclick="bulk('stop')">${svg(I.stop)}Đóng</button>
      <button class="btn sm" onclick="bulkClone()">${svg(I.copy)}Nhân bản</button>
      <button class="btn sm" onclick="bulkExport()">${svg(I.up)}Export</button>
      <button class="btn sm" onclick="bulkTag()">${svg(I.plus)}Gán tag</button>
      <button class="btn sm" onclick="bulk('delete')">🗑 Xoá</button>
      <button class="btn sm" onclick="clearSel()">Bỏ chọn</button></div>`:"";

function auInitSteps(){if(STATE.autoSteps===undefined){try{STATE.autoSteps=JSON.parse(STATE.autoScript||"");}catch(e){STATE.autoSteps=[{action:"goto",url:"https://ip8.com"},{action:"wait",ms:2000},{action:"screenshot",path:"shot.png"}];}}}
function auStepsClean(){return (STATE.autoSteps||[]).map(s=>{const o={action:s.action};for(const k in s){if(k==="action")continue;let v=s[k];if((k==="ms"||k==="y")&&v!=="")v=Number(v);if(v!==""&&v!=null)o[k]=v;}return o;});}
function auGetSteps(){return (STATE.autoMode||"build")==="json"?JSON.parse(val("auJson")):auStepsClean();}
/* Option select nhóm theo cat (optgroup). Giữ cả action control-flow (loop/if...) nếu step đang là nó. */
function auActionOptions(sel){const cats={};Object.entries(AU_ACTIONS).forEach(([k,v])=>{(cats[v.cat]=cats[v.cat]||[]).push([k,v.label]);});
  let html=Object.entries(cats).map(([c,arr])=>`<optgroup label="${esc(c)}">${arr.map(([k,l])=>`<option value="${k}" ${sel===k?'selected':''}>${esc(l)}</option>`).join("")}</optgroup>`).join("");
  if(!AU_ACTIONS[sel])html=`<optgroup label="Điều khiển (JSON)"><option value="${esc(sel)}" selected>${esc(sel)}</option></optgroup>`+html;
  return html;}
function auBuilder(){const steps=STATE.autoSteps||[];
  return steps.length?steps.map((s,i)=>{const def=AU_ACTIONS[s.action];
    const fields=def?def.f.map(([key,lbl,ph])=>`<input placeholder="${esc(lbl)}" title="${esc(lbl)}" value="${esc(s[key]==null?'':s[key])}" oninput="auSetField(${i},'${key}',this.value)">`).join("")
      :`<span class="dim" style="font-size:12px;align-self:center">⛓ bước điều khiển — sửa ở chế độ <b>JSON</b></span>`;
    return `<div class="austep"><span class="auno">${i+1}</span>
      <select onchange="auSetAction(${i},this.value)">${auActionOptions(s.action)}</select>
      ${fields}
      <span class="gp"><button class="btn sm" onclick="auMove(${i},-1)" title="Lên">↑</button><button class="btn sm" onclick="auMove(${i},1)" title="Xuống">↓</button><button class="btn sm" onclick="auDel(${i})" title="Xoá">🗑</button></span>
    </div>`;}).join(""):'<p class="dim" style="padding:8px 0">Chưa có bước nào — bấm <b>Thêm bước</b> để dựng kịch bản.</p>';}
function auRerender(){const el=document.getElementById("auSteps");if(el)el.innerHTML=auBuilder();}
function auAddStep(){auInitSteps();STATE.autoSteps.push({action:"goto",url:""});auRerender();}
function auSetAction(i,a){STATE.autoSteps[i]={action:a};auRerender();}
function auSetField(i,k,v){STATE.autoSteps[i][k]=v;}
function auDel(i){STATE.autoSteps.splice(i,1);auRerender();}
function auMove(i,d){const a=STATE.autoSteps,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];auRerender();}
function auMode(m){if(m==="build"){try{STATE.autoSteps=JSON.parse(val("auJson"));}catch(e){}}STATE.autoMode=m;render();}

async function auRecordToggle(){

/* Đồng bộ thao tác: chạy cùng 1 kịch bản trên MỌI profile đang chạy, song song */
async function auRunAll(){let steps;try{steps=auGetSteps();}catch(e){return toast("JSON lỗi","err");}
  if(!steps||!steps.length)return toast("Chưa có bước nào","");
  const ids=STATE.profiles.filter(p=>p.status==="running").map(p=>p.id);
  if(!ids.length)return toast("Không có profile nào đang chạy — mở vài profile trước","err");
  if(!confirm(`Chạy kịch bản (${steps.length} bước) ĐỒNG THỜI trên ${ids.length} profile đang mở?`))return;
  const o=document.getElementById("auOut"),st=document.getElementById("auStatus");
  auSetRunning(true);st.innerHTML=`<span class="dot ok"></span> Đồng bộ trên ${ids.length} profile...`;o.textContent="";
  const res=await Promise.all(ids.map(async id=>{try{const d=await j(`${API}/profiles/${id}/run`,body({steps,headless:false}));return {id,ok:d.ok};}catch(e){return {id,ok:false,err:e.message};}}));
  const okN=res.filter(r=>r.ok).length;
  o.textContent=res.map(r=>`${r.ok?'✓':'✗'} ${r.id.slice(0,8)}${r.err?' — '+r.err:''}`).join("\n");
  st.innerHTML=`<span style="color:${okN===ids.length?'var(--ok)':'var(--warn)'}">● ${okN}/${ids.length} xong</span>`;
  auSetRunning(false);toast(`Đồng bộ: ${okN}/${ids.length} profile xong`,okN?"ok":"err");}
async function auRun(){const id=document.getElementById("auProf").value;let steps;try{steps=auGetSteps();}catch(e){return toast("JSON lỗi","err");}
  if(!steps||!steps.length)return toast("Chưa có bước nào","");
  const o=document.getElementById("auOut"),st=document.getElementById("auStatus");
  auSetRunning(true);st.innerHTML='<span class="dot ok"></span> Đang chạy...';o.textContent="";AUABORT=new AbortController();
  try{const r=await fetch(`${API}/profiles/${id}/run`,{...body({steps,headless:true}),signal:AUABORT.signal});
    const d=await r.json();if(!d.success)throw new Error(d.message||"Lỗi");const dd=d.data;
    o.textContent="ok="+dd.ok+"\n"+(dd.log||[]).join("\n")+"\n\ndata="+JSON.stringify(dd.data,null,2);
    st.innerHTML=dd.ok?'<span style="color:var(--ok)">● Xong</span>':'<span style="color:var(--err)">● Có lỗi</span>';
    toast(dd.ok?"Chạy xong":"Có lỗi khi chạy",dd.ok?"ok":"err");
  }catch(e){if(e.name==="AbortError"){o.textContent="Đã huỷ chờ kết quả (tiến trình trên máy có thể vẫn chạy tới khi xong).";st.innerHTML='<span class="dim">● Đã huỷ chờ</span>';}
    else{o.textContent=e.message;st.innerHTML='<span style="color:var(--err)">● Lỗi</span>';toast(e.message,"err");}}
  finally{auSetRunning(false);AUABORT=null;}}

    <div class="card" style="padding:20px"><div class="inline" style="justify-content:space-between"><b>Lịch chạy</b><button class="btn sm pri" onclick="schNew()">${svg(I.plus)}Thêm lịch</button></div>
      <div id="schForm"></div>
      <div id="schList" class="dim" style="margin-top:12px">Đang tải...</div></div>
    <div class="card" style="padding:20px"><div class="inline" style="justify-content:space-between"><b>Nhật ký chạy</b><button class="btn sm" onclick="clearRuns()">Xoá nhật ký</button></div>
      <div id="runList" class="dim" style="margin-top:12px;max-height:540px;overflow:auto">Đang tải...</div></div>
  </div>`;}
async function loadSchedules(){try{STATE.schedules=await j(`${API}/schedules`);STATE.scripts=await j(`${API}/scripts`);}catch(e){}
  renderSchList();loadRuns();}
function renderSchList(){const el=document.getElementById("schList");if(!el)return;const ss=STATE.schedules||[];
  if(!ss.length){el.innerHTML='<p class="dim" style="padding:6px 0">Chưa có lịch nào — bấm <b>Thêm lịch</b>.</p>';return;}
  el.innerHTML=ss.map(s=>{const sc=(STATE.scripts||[]).find(x=>x.id===s.script_id);
    return `<div class="austep" style="align-items:center">
      <span class="dot ${s.enabled?'ok':''}" title="${s.enabled?'đang bật':'tắt'}"></span>
      <div style="flex:1;min-width:0"><b>${esc(s.name)}</b> <span class="dim" style="font-size:12px">· ${s.kind==='daily'?('hằng ngày '+esc(s.at_time)):('mỗi '+s.interval_min+' phút')} · ${(s.profile_ids||[]).length} profile · ${esc(sc?sc.name:'(kịch bản đã xoá)')}</span>
        <div class="dim" style="font-size:12px">Kế tiếp: ${s.enabled?fmtTime(s.next_run):'—'} · lần cuối: ${s.last_run?fmtAgo(s.last_run):'chưa'}</div></div>
      <span class="gp"><button class="btn sm" onclick="schRunNow('${s.id}')" title="Chạy ngay">▶</button>
        <button class="btn sm" onclick="schToggle('${s.id}',${s.enabled?0:1})">${s.enabled?'Tắt':'Bật'}</button>
        <button class="btn sm" onclick="schDel('${s.id}')">🗑</button></span></div>`;}).join("");}
async function loadRuns(){let runs=[];try{runs=await j(`${API}/runs?limit=60`);}catch(e){}
  const el=document.getElementById("runList");if(!el)return;
  el.innerHTML=runs.length?runs.map(r=>`<div class="austep" style="align-items:center">
    <span class="dot ${r.ok===true?'ok':(r.ok===false?'err':'')}"></span>
    <div style="flex:1;min-width:0"><b>${esc(r.profile_name||'')}</b> <span class="dim" style="font-size:12px">· ${esc(r.script_name||'')} · ${r.source==='schedule'?'lịch':'tay'}</span>
      <div class="dim" style="font-size:12px">${fmtTime(r.started_at)} · ${r.ok===null?'đang chạy…':(r.ok?'✓ OK':'✗ LỖI')}</div></div></div>`).join(""):'<p class="dim" style="padding:6px 0">Chưa có lần chạy nào.</p>';}
async function clearRuns(){if(!confirm("Xoá toàn bộ nhật ký chạy?"))return;try{await j(`${API}/runs`,{method:"DELETE"});loadRuns();}catch(e){}}
function schNew(){const el=document.getElementById("schForm");if(!el)return;
  const scripts=STATE.scripts||[],profs=STATE.profiles||[];
  if(!scripts.length){toast("Chưa có kịch bản đã lưu — qua Automation bấm 'Lưu kịch bản này' trước","err");return;}
  el.innerHTML=`<div class="card" style="padding:14px;margin-top:10px;border:1px solid var(--primary)">
    <label>Tên lịch</label><input id="schName" value="Lịch mới">
    <label style="margin-top:8px">Kịch bản</label><select id="schScript">${scripts.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
    <label style="margin-top:8px">Chu kỳ</label><select id="schKind" onchange="schKindChange()"><option value="interval">Mỗi N phút</option><option value="daily">Hằng ngày lúc</option></select>
    <div id="schIntWrap" style="margin-top:6px"><input id="schInt" type="number" value="60" placeholder="số phút"></div>
    <div id="schTimeWrap" style="margin-top:6px;display:none"><input id="schTime" value="09:00" placeholder="HH:MM"></div>
    <label style="margin-top:8px">Profile áp dụng</label>
    <div style="max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px">${profs.length?profs.map(p=>`<label style="display:block;font-weight:400;cursor:pointer"><input type="checkbox" class="schProf" value="${p.id}"> ${esc(p.name)}</label>`).join(""):'<span class="dim">Chưa có profile</span>'}</div>
    <div class="toolbar" style="margin-top:10px"><button class="btn pri" onclick="schSave()">Lưu lịch</button><button class="btn" onclick="document.getElementById('schForm').innerHTML=''">Huỷ</button></div>
  </div>`;}
function schKindChange(){const k=val("schKind");const iw=document.getElementById("schIntWrap"),tw=document.getElementById("schTimeWrap");if(iw)iw.style.display=k==='interval'?'':'none';if(tw)tw.style.display=k==='daily'?'':'none';}
async function schSave(){const ids=[...document.querySelectorAll(".schProf:checked")].map(x=>x.value);
  if(!ids.length)return toast("Chọn ít nhất 1 profile","err");
  const d={name:val("schName")||"Lịch",script_id:val("schScript"),profile_ids:ids,kind:val("schKind"),interval_min:Number(val("schInt"))||60,at_time:val("schTime")||""};
  try{await j(`${API}/schedules`,body(d));document.getElementById("schForm").innerHTML="";toast("Đã tạo lịch","ok");loadSchedules();}catch(e){toast(e.message,"err");}}
async function schToggle(id,en){try{await j(`${API}/schedules/${id}`,{...H,method:"PUT",body:JSON.stringify({enabled:!!en})});loadSchedules();}catch(e){toast(e.message,"err");}}
async function schDel(id){if(!confirm("Xoá lịch này?"))return;try{await j(`${API}/schedules/${id}`,{method:"DELETE"});loadSchedules();}catch(e){}}
async function schRunNow(id){try{const r=await j(`${API}/schedules/${id}/run-now`,body({}));toast(`Đang chạy ${r.fired} profile…`,"ok");setTimeout(loadRuns,2000);}catch(e){toast(e.message,"err");}}

/* ----- Engine đa-version (tải theo yêu cầu + khoá version per-profile) ----- */
let ENGPOLL=null;
function viewEngines(){return `<div class="phead"><h1>Engine <em>trình duyệt</em></h1><p>Mỗi profile khoá 1 phiên bản Chrome riêng (fingerprint ổn định theo đời nick + đa dạng version tránh lộ pattern). Tải thêm version theo yêu cầu.</p></div>
  <div id="engBody" class="dim" style="padding:12px">Đang tải...</div>`;}
async function loadEngines(){let d;try{d=await j(`${API}/engines`);}catch(e){const b=document.getElementById("engBody");if(b)b.textContent="Lỗi: "+e.message;return;}
  STATE.engines=d;renderEngines();
  clearTimeout(ENGPOLL);
  if(Object.values(d.status||{}).some(s=>s.state==='downloading'||s.state==='extracting'))ENGPOLL=setTimeout(loadEngines,2000);}
function renderEngines(){const b=document.getElementById("engBody");if(!b)return;const d=STATE.engines||{},st=d.status||{};
  const inst=(d.installed||[]).map(e=>`<div class="austep" style="align-items:center">
    <span class="dot ok"></span><div style="flex:1"><b>Chrome ${esc(e.version)}</b>${e.builtin?' <span class="dim" style="font-size:12px">· gói sẵn</span>':''}</div>
    ${e.builtin?'':`<button class="btn sm" onclick="engDelete('${esc(e.version)}')">🗑</button>`}</div>`).join("")||'<p class="dim">Chưa có engine.</p>';
  const avail=(d.available||[]).map(e=>{const p=st[e.version],busy=p&&(p.state==='downloading'||p.state==='extracting');
    return `<div class="austep" style="align-items:center"><span class="dot"></span>
    <div style="flex:1"><b>Chrome ${esc(e.version)}</b> <span class="dim" style="font-size:12px">· ${e.size?('≈'+Math.round(e.size/1048576)+' MB'):'tải thêm'}${busy?(' · '+(p.state==='extracting'?'giải nén…':('tải '+p.pct+'%'))):''}${p&&p.state==='error'?(' · lỗi'):''}</span></div>
    <button class="btn sm pri" ${busy?'disabled':''} onclick="engDownload('${esc(e.version)}','${esc(e.url)}')">${busy?'…':'⬇ Tải'}</button></div>`;}).join("")||'<p class="dim" style="font-size:13px">Không có bản để tải — cấu hình <code>engines_url</code> (manifest engines.json) ở Cài đặt, hoặc bản gói sẵn đã đủ dùng.</p>';
  b.innerHTML=`<div class="split" style="grid-template-columns:1fr 1fr;align-items:start">
    <div class="card" style="padding:18px"><b>Đã cài</b><div style="margin-top:10px">${inst}</div></div>
    <div class="card" style="padding:18px"><b>Tải thêm</b><div style="margin-top:10px">${avail}</div></div></div>`;}
async function engDownload(ver,url){try{await j(`${API}/engines/download`,body({version:ver,url}));toast("Bắt đầu tải Chrome "+ver,"ok");loadEngines();}catch(e){toast(e.message,"err");}}
async function engDelete(ver){if(!confirm("Xoá engine "+ver+"?"))return;try{await j(`${API}/engines/${ver}`,{method:"DELETE"});toast("Đã xoá","");loadEngines();}catch(e){toast(e.message,"err");}}

    b.innerHTML=`<div class="card" style="padding:24px;max-width:470px">

}
const tvv=id=>(document.getElementById(id)||{}).value||"";
async function teamLogin(){const m=document.getElementById("cloudMsg");if(m)m.textContent="Đang đăng nhập...";try{await j(`${API}/team/login`,body({url:tvv("tvUrl"),username:tvv("tvUser"),password:tvv("tvPass")}));toast("Đăng nhập team OK","ok");loadCloud();}catch(e){if(m)m.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`;}}
async function teamRegister(){const m=document.getElementById("cloudMsg");if(m)m.textContent="Đang đăng ký...";try{const d=await j(`${API}/team/register`,body({url:tvv("tvUrl"),username:tvv("tvUser"),password:tvv("tvPass")}));if(m)m.innerHTML=`<span style="color:var(--ok)">Đã tạo <b>${esc(d.username)}</b> (${esc(d.role)}). Bấm Đăng nhập.</span>`;}catch(e){if(m)m.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`;}}
async function teamLogout(){try{await j(`${API}/team/logout`,body({}));toast("Đã đăng xuất team");loadCloud();}catch(e){toast(e.message,"err");}}
async function teamSync(btn){const m=document.getElementById("cloudMsg");if(m)m.textContent="Đang đồng bộ...";if(btn)btn.disabled=true;try{const d=await j(`${API}/team/sync`,body({}));if(m)m.innerHTML=`<span style="color:var(--ok)">● Xong — đẩy ${d.pushed}, kéo về ${d.pulled} profile</span>`;refresh();}catch(e){if(m)m.innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`;}if(btn)btn.disabled=false;}
async function teamShare(pid){const name=(STATE.profiles.find(p=>p.id===pid)||{}).name||pid;const u=prompt(`Chia sẻ profile "${name}" cho ai? (username trên team server)`);if(!u)return;const perm=(prompt("Quyền: read / run / write","read")||"").trim();if(!perm)return;try{await j(`${API}/team/share`,body({profile_id:pid,username:u.trim(),permission:perm}));toast(`Đã chia sẻ cho ${u.trim()} (${perm})`,"ok");}catch(e){toast(e.message,"err");}}

function viewSoon(v){const t={plugins:"Plugins"}[v]||v;

function onSel(id,on){on?STATE.sel.add(id):STATE.sel.delete(id);render();}
function toggleAll(on){STATE.profiles.forEach(p=>on?STATE.sel.add(p.id):STATE.sel.delete(p.id));render();}

async function act(path,msg,cb){try{await j(`${API}/profiles/${path}`,{method:"POST"});toast(msg,"ok");cb?cb():refresh();}catch(e){toast(e.message,"err");}}
async function startP(id){try{const d=await j(`${API}/profiles/start/${id}`,body({}));toast(`Mở [${d.engine}] ${(''+d.ws_endpoint).slice(0,40)}…`,"ok");refresh();}catch(e){toast(e.message,"err");}}
async function cloneP(id){try{const d=await j(`${API}/profiles/${id}/clone`,{method:"POST"});toast("Nhân bản → "+d.name,"ok");refresh();}catch(e){toast(e.message,"err");}}
async function randP(id){try{await j(`${API}/profiles/${id}/fingerprint/randomize`,body({}));toast("Đã random fingerprint (GPU/cores coherent)","ok");refresh();}catch(e){toast(e.message,"err");}}
async function delP(id,name){if(!confirm(`Xoá "${name}" vào thùng rác?`))return;try{await j(`${API}/profiles/${id}`,{method:"DELETE"});toast("Đã xoá","ok");refresh();}catch(e){toast(e.message,"err");}}
async function purge(id,name){if(!confirm(`Xoá VĨNH VIỄN "${name}"?`))return;try{await j(`${API}/profiles/${id}/purge`,{method:"DELETE"});toast("Đã xoá vĩnh viễn");loadTrash();}catch(e){toast(e.message,"err");}}
async function bulkClone(){if(!STATE.sel.size)return;let n=0;for(const id of[...STATE.sel]){try{await j(`${API}/profiles/${id}/clone`,{method:"POST"});n++;}catch(e){}}toast(`Đã nhân bản ${n} profile`,"ok");STATE.sel.clear();refresh();}
async function bulkExport(){if(!STATE.sel.size)return;try{const all=await j(`${API}/profiles/export`);const pick=all.filter(p=>STATE.sel.has(p.id));const blob=new Blob([JSON.stringify(pick,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`pinkagc-profiles-${pick.length}.json`;a.click();toast(`Đã export ${pick.length} profile`,"ok");}catch(e){toast(e.message,"err");}}
async function bulkTag(){if(!STATE.sel.size)return;const s=prompt("Tag (cách nhau bằng dấu phẩy) để gán cho "+STATE.sel.size+" profile:");if(s===null)return;const add=s.split(",").map(t=>t.trim()).filter(Boolean);if(!add.length)return;try{const d=await j(`${API}/profiles/tag`,body({ids:[...STATE.sel],add}));toast(`Đã gán tag cho ${d.updated} profile`,"ok");STATE.sel.clear();refresh();}catch(e){toast(e.message,"err");}}
async function bulk(action){if(!STATE.sel.size)return;if(action==="delete"&&!confirm(`Xoá ${STATE.sel.size} profile?`))return;try{await j(`${API}/profiles/bulk`,body({action,ids:[...STATE.sel]}));toast(`${action} ${STATE.sel.size} profile`,"ok");STATE.sel.clear();refresh();}catch(e){toast(e.message,"err");}}

/* ----- proxy actions ----- */
function addPrx(){
  document.getElementById("overlay").innerHTML=`<div class="modal sm">
   <div class="mhead"><div class="ic">${svg(I.plus)}</div><h2>Thêm proxy</h2><button class="x" onclick="show(false)">✕</button></div>
   <div class="mbody">
    <div class="field"><label>Loại proxy</label><select id="pxType">
      <option value="">Tự nhận (auto)</option><option value="http">Http</option><option value="https">Https</option><option value="socks5">Socks5</option></select></div>
    <div class="field"><label>Danh sách proxy</label>
      <textarea id="pxList" rows="9" placeholder="Nhập proxy" class="mono" style="resize:vertical"></textarea></div>
    <p class="dim" style="font-size:12.5px">Mỗi dòng là một proxy, định dạng <b>IP:Port</b> hoặc <b>IP:Port:User:Pass</b>. Với Socks5 nếu hỗ trợ UDP forward, điền thêm <b>:True</b> ở cuối.</p>
    <div id="pxSt" class="dim" style="font-size:13px"></div>
   </div>
   <div class="mfoot"><button class="btn" onclick="show(false)">Cancel</button><button class="btn pri" onclick="savePrxBulk()">OK</button></div></div>`;
  show(true);
}
async function savePrxBulk(){
  const type=val("pxType"),lines=val("pxList").split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return toast("Chưa nhập proxy","");
  let ok=0;for(const ln of lines){const raw=(type&&!ln.includes("://"))?`${type}://${ln}`:ln;
    try{await j(`${API}/proxies`,body({raw_proxy:raw}));ok++;}catch(e){}}
  show(false);toast(`Đã thêm ${ok}/${lines.length} proxy`,"ok");refresh();
}
async function delPrx(id){try{await j(`${API}/proxies/${id}`,{method:"DELETE"});toast("Đã xoá");refresh();}catch(e){toast(e.message,"err");}}
async function checkPrx(id){const x=STATE.proxies.find(p=>p.id===id);if(!x)return;toast("Đang kiểm tra...","");try{const d=await j(`${API}/proxy/check`,body({raw_proxy:x.raw_proxy}));toast(d.alive?`● Sống ${d.exit_ip||''} ${d.country||''} · ${d.latency_ms}ms`:`● Chết: ${d.error||''}`,d.alive?"ok":"err");}catch(e){toast(e.message,"err");}}

async function pickFile(inputId,filter,convertTo){
  let d;try{d=await j(`${API}/pick-file`,body({filter:filter||"All files|*.*"}));}catch(e){return toast(e.message,"err");}
  if(!d.path)return;let path=d.path;const ext=(path.split('.').pop()||'').toLowerCase();

  const el=document.getElementById(inputId);if(el)el.value=path;if(!convertTo||ext===convertTo)toast("Đã chọn file","ok");}

async function doCreate(){
  const name=(val("cName")||"").trim(), os=val("cOs","Windows"), browser=val("cBrowser","Chrome"),
    engine=val("cEngine"), proxy=val("cProxy"), tz=val("cTz"), group_id=val("cGroup"), cookies=val("cCookies");
  const err=document.getElementById("cNameErr");
  if(!name){if(err)err.classList.add("show");CT.tab="nhanh";switchTab&&document.querySelector('.tabs button[data-tt="nhanh"]')?.click();return toast("Nhập tên profile","err");}
  if(err)err.classList.remove("show");
  const count=Math.max(1,Math.min(200,parseInt(val("cCount","1"))||1));
  const start=Math.max(1,parseInt(val("cStart","1"))||1);
  const base=(val("cNameRule")||"").trim()||name;                    // ưu tiên quy tắc đặt tên, không có thì dùng tên
  const tmpl=(count>1&&!base.includes("{n}"))?base+" {n}":base;       // loạt mà thiếu {n} -> tự thêm để không trùng
  const nameAt=i=>tmpl.replace(/\{n\}/g,String(start+i));
  // meta chung (tags/note/màu/ghim) áp cho mọi profile tạo ra
  const tags=val("cTags").split(",").map(t=>t.trim()).filter(Boolean);
  const color=val("cColor"), note=val("cNote"), pinned=document.getElementById("cPin")?.checked;
  const advOn=document.getElementById("cMaster")?.checked;   // Master Power: tắt -> bỏ qua toàn bộ spoof nâng cao
  const bandwidth=advOn&&document.getElementById("cBandwidth")?.checked, engineVer=advOn?val("cEngineVer"):"", fakeCam=advOn?val("cFakeCam"):"", fakeMic=advOn?val("cFakeMic"):"";
  const hasMeta=tags.length||note||pinned||(color&&color.toLowerCase()!=="#ea1a87");
  let ckZero=false;
  const applyExtras=async pid=>{
    if(proxy) await j(`${API}/profiles/${pid}/proxy`,body({raw_proxy:proxy})).catch(()=>{});
    if(tz) await j(`${API}/profiles/${pid}/timezone`,body({timezone:tz})).catch(()=>{});
    if(cookies.trim()){const cr=await j(`${API}/profiles/${pid}/cookies`,body({cookies})).catch(()=>null);if(cr&&cr.count===0)ckZero=true;}
    if(hasMeta) await j(`${API}/profiles/${pid}/meta`,body({tags,note,color,pinned})).catch(()=>{});
    if(bandwidth||engineVer||fakeCam||fakeMic) await j(`${API}/profiles/${pid}/options`,body({save_bandwidth:!!bandwidth,engine_version:engineVer||"",fake_camera:fakeCam||"",fake_mic:fakeMic||""})).catch(()=>{});
  };
  try{
    if(count>1){
      const d=await j(`${API}/profiles/bulk-create`,body({count,name:tmpl,os,browser,engine,group_id:group_id||null}));
      await Promise.all(d.profiles.map(async(p,i)=>{
        await j(`${API}/profiles/update/${p.id}`,body({name:nameAt(i)})).catch(()=>{});  // đổi tên theo quy tắc {n}
        await applyExtras(p.id);
      }));
      show(false);toast(`Đã tạo ${d.created} profile`+(ckZero?" · cookies không parse được (sai định dạng)":""),ckZero?"err":"ok");refresh();return;
    }
    const r=await j(`${API}/profiles/create`,body({name:nameAt(0),os,browser,engine,group_id:group_id||null}));
    await applyExtras(r.id);
    show(false);toast("Đã tạo profile: "+r.name+(ckZero?" · cookies không parse được (sai định dạng)":""),ckZero?"err":"ok");refresh();
  }catch(e){toast(e.message,"err");}
}

          <div class="checkline" style="margin-bottom:0"><label class="toggle"><input id="eBandwidth" type="checkbox" ${dyn.save_bandwidth?'checked':''}><span></span></label> Tiết kiệm băng thông (chặn tải ảnh)</div>
          <div class="field" style="margin-top:12px"><label>Phiên bản Chrome <span class="dim" style="font-weight:400">· khoá version cho nick</span></label><select id="eEngineVer">${engOpts}</select></div>
          <div class="split" style="grid-template-columns:1fr 1fr;margin-bottom:0">
            <div class="field" style="margin-bottom:0"><label>Camera giả (.y4m)</label><div class="inline" style="gap:6px"><input id="eFakeCam" value="${esc(dyn.fake_camera||'')}" placeholder="C:\\video\\face.y4m" style="flex:1"><button type="button" class="btn sm" onclick="pickFile('eFakeCam','Video|*.y4m;*.mp4;*.mov;*.avi;*.webm|All|*.*','y4m')">Browse</button></div></div>
            <div class="field" style="margin-bottom:0"><label>Micro giả (.wav)</label><div class="inline" style="gap:6px"><input id="eFakeMic" value="${esc(dyn.fake_mic||'')}" placeholder="C:\\audio\\voice.wav" style="flex:1"><button type="button" class="btn sm" onclick="pickFile('eFakeMic','Audio|*.wav;*.mp3;*.m4a;*.aac|All|*.*','wav')">Browse</button></div></div>
          </div>
        </div>
      </div>`)}
    ${EP_("cookies",`<div class="field"><label>Nạp cookies (JSON hoặc Netscape)</label><textarea id="eCookies" rows="8" class="mono" style="resize:vertical" placeholder='[{"name":"...","value":"...","domain":".facebook.com"}]'></textarea></div>
      <p class="dim" style="font-size:13px">Dán cookie rồi Lưu — sẽ nạp vào profile ở lần Mở tới. Để trống nếu không đổi.</p>`)}
   </div>
   <div class="mfoot"><button class="btn" onclick="show(false)">Huỷ</button><button class="btn pri" onclick="saveEdit()">${svg(I.check)}Lưu thay đổi</button></div></div>`;
  show(true);toggleAdv('e');}
async function saveEdit(){const id=EP.id,fp=EP.fp;
  fp.navigator=fp.navigator||{};fp.screen=fp.screen||{};fp.webgl_meta_data=fp.webgl_meta_data||{};
  fp.canvas=fp.canvas||{};fp.client_rect=fp.client_rect||{};fp.webgl_image=fp.webgl_image||{};fp.audio_context=fp.audio_context||{};
  fp.navigator.hardware_concurrency=+val("eCores");fp.navigator.device_memory=+val("eMem");
  fp.navigator.do_not_track=document.getElementById("eDnt").checked;
  const sr=val("eScreen");if(sr==="real"){fp.screen.width=-1;fp.screen.height=-1;}else{const a=sr.split("x");fp.screen.width=+a[0];fp.screen.height=+a[1];}
  const gi=+val("eGpu");if(gi>=0){fp.webgl_meta_data.mode="Masked";fp.webgl_meta_data.vendor=GPUS[gi].v;fp.webgl_meta_data.renderer=GPUS[gi].r;}
  fp.canvas.mode=val("eCanvas");fp.client_rect.mode=val("eRects");fp.webgl_image.mode=val("eWebgl");fp.audio_context.mode=val("eAudio");
  try{
    await j(`${API}/profiles/update/${id}`,body({name:val("eName"),group_id:val("eGroup")||null,fingerprint_data:fp}));
    await j(`${API}/profiles/${id}/meta`,body({note:val("eNote"),color:val("eColor"),pinned:document.getElementById("ePin").checked,tags:val("eTags").split(",").map(t=>t.trim()).filter(Boolean)}));
    await j(`${API}/profiles/${id}/timezone`,body({timezone:val("eTz")}));
    const em=document.getElementById("eMaster")?.checked;   // Master tắt -> lưu sạch, xoá spoof cũ
    await j(`${API}/profiles/${id}/options`,body({save_bandwidth:!!(em&&document.getElementById("eBandwidth")?.checked),engine_version:em?(val("eEngineVer")||""):"",fake_camera:em?(val("eFakeCam")||""):"",fake_mic:em?(val("eFakeMic")||""):""})).catch(()=>{});
    let ckWarn="";
    const ck=val("eCookies").trim();if(ck){const cr=await j(`${API}/profiles/${id}/cookies`,body({cookies:ck})).catch(()=>null);if(cr&&cr.count===0)ckWarn=" · cookies không parse được (sai định dạng JSON/Netscape)";}
    show(false);toast("Đã lưu"+ckWarn, ckWarn?"err":"ok");refresh();
  }catch(e){toast(e.message,"err");}}

/* ----- assign proxy to profile ----- */
function openProxy(id){const p=STATE.profiles.find(x=>x.id===id)||{};
  document.getElementById("overlay").innerHTML=`<div class="modal sm">
   <div class="mhead"><div class="ic">${svg(I.globe)}</div><h2>Gán proxy</h2><button class="x" onclick="show(false)">✕</button></div>
   <div class="mbody">
    <div class="field"><label>Proxy (dán trần — tự nhận http/socks5)</label><input id="apRaw" placeholder="host:port:user:pass"></div>
    <div class="field"><label>Hoặc provider</label><select id="apProv"><option value="">— nhập raw —</option>${STATE.providers.map(p=>`<option>${esc(p)}</option>`).join("")}</select></div>
    <div class="field"><label>API key (nếu dùng provider)</label><input id="apKey" placeholder="api_key"></div>
    <div id="apSt" class="dim"></div>
   </div>
   <div class="mfoot"><button class="btn ghost-pink" onclick="apCheck()">Kiểm tra</button><button class="btn" onclick="show(false)">Huỷ</button><button class="btn pri" onclick="apSave('${id}')">Gán</button></div></div>`;
  show(true);}
async function apCheck(){const raw=val("apRaw");if(!raw)return toast("Nhập raw proxy để kiểm tra","");document.getElementById("apSt").textContent="Đang kiểm tra...";try{const d=await j(`${API}/proxy/check`,body({raw_proxy:raw}));document.getElementById("apSt").innerHTML=d.alive?`<span style="color:var(--ok)">● Sống</span> ${esc(d.exit_ip||'')} ${esc(d.country||'')} · ${d.latency_ms}ms · ${esc(d.scheme||'')}`:`<span style="color:var(--err)">● Chết</span> ${esc(d.error||'')}`;}catch(e){document.getElementById("apSt").textContent=e.message;}}
async function apSave(id){const prov=val("apProv");const payload=prov?{provider:prov,api_key:val("apKey")}:{raw_proxy:val("apRaw")};try{const d=await j(`${API}/profiles/${id}/proxy`,body(payload));show(false);toast("Proxy: "+(d.raw_proxy||'(trống)'),"ok");refresh();}catch(e){toast(e.message,"err");}}

/* ---------- a11y: tự nối label + id cho field (động, phủ cả modal) ---------- */
const _lblSeen=new WeakSet();
function linkLabels(){
  document.querySelectorAll('#content input,#content select,#content textarea,#overlay input,#overlay select,#overlay textarea').forEach(el=>{
    if(el.type==='hidden'||_lblSeen.has(el))return;
    _lblSeen.add(el);
    if(!el.id&&!el.name)el.id='f_'+Math.random().toString(36).slice(2,9);
    // đã nằm trong <label> bọc ngoài: chỉ thiếu accessible name -> lấy từ span cạnh bên
    const wrap=el.closest('label');
    if(wrap){
      if(!el.getAttribute('aria-label')){
        const host=el.closest('.segrow,.checkline,.inline');
        const t=host?host.textContent.replace(/\s+/g,' ').trim():'';
        if(t)el.setAttribute('aria-label',t);
      }
      return;
    }
    if(el.getAttribute('aria-label'))return;
    // bước automation: select = hành động, input = tham số (lấy từ placeholder)
    if(el.closest('.austep')){el.setAttribute('aria-label',el.tagName==='SELECT'?'Hành động của bước':(el.placeholder||'Tham số'));return;}
    const field=el.closest('.field,.segrow,.checkline,.createtop');
    let lab=field?field.querySelector(':scope > label, label'):null;
    if(!lab){const p=el.previousElementSibling;if(p&&p.tagName==='LABEL')lab=p;}
    if(lab&&!lab.htmlFor){lab.htmlFor=el.id;}
    else if(!lab){
      let t=(el.placeholder||el.title||'').trim();
      if(!t&&el.tagName==='SELECT'){const o=el.querySelector('option');t=(o?o.textContent:'').replace(/[-—\s]+/g,' ').trim();}  // select: lấy option đầu làm tên
      if(!t&&el.type==='file')t='Chọn tệp';
      if(!t&&(el.type==='checkbox'||el.type==='radio'))t=el.classList.contains('rowchk')?'Chọn dòng':(el.closest('thead')?'Chọn tất cả':'Chọn');
      if(t)el.setAttribute('aria-label',t);
    }
  });
}
(function(){const o=new MutationObserver(()=>{clearTimeout(window._lblT);window._lblT=setTimeout(linkLabels,80);});
  ['content','overlay'].forEach(id=>{const n=document.getElementById(id);if(n)o.observe(n,{childList:true,subtree:true});});})();

(async function(){renderNav();await load();render();loadHealth();linkLabels();setInterval(()=>{
  if(STATE.view!=='home'&&STATE.view!=='profiles')return;
  if(document.getElementById('overlay').classList.contains('show'))return;
  const cm=document.getElementById('colMenu');if(cm&&cm.style.display==='block')return;  // đừng đóng menu cột đang mở
  if(document.querySelector('.kmenu.show'))return;                                        // đừng đóng menu ⋯ đang mở
  const pq=document.getElementById('pq');if(pq&&(pq.value||pq===document.activeElement))return;  // đừng clobber khi đang tìm
  const sc=document.getElementById('content'),y=sc?sc.scrollTop:0;                        // giữ vị trí cuộn qua auto-refresh
  load().then(()=>{render();const el=document.getElementById('content');if(el)el.scrollTop=y;});
},6000);})();
</script>
